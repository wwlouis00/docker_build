version: "3.9"

services:
  ubuntu-env:
    image: ${DOCKER_IMAGE:-learnwwlouis/wwlouis00_ubuntu_22:v4}
    container_name: ${CONTAINER_NAME:-wwlouis_ubuntu_container}
    user: "${CONTAINER_USER:-wwlouis}"
    tty: true
    stdin_open: true
    working_dir: /home/wwlouis
    volumes:
      - ${HOST_WORKDIR:-./workspace}:/home/wwlouis
    environment:
      - TZ=Asia/Taipei
    init: true
